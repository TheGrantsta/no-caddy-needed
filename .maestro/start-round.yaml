appId: com.grantsta.golf.nocaddyneeded
---
# E2E: Start Round — par 72 (par-3s: 3,6,12,15 | par-5s: 5,8,13,16)

# Launch fresh — clears DB and app state
- launchApp:
    clearState: true

# Wait for home onboarding (first-launch, single step)
- extendedWaitUntil:
    visible:
      id: "done-button"
    timeout: 90000

# Complete home onboarding (single step)
- tapOn:
    id: "done-button"
# Wait for the onboarding overlay to finish closing before the next tap
- extendedWaitUntil:
    notVisible:
      id: "done-button"
    timeout: 5000

# Wait for home screen
- extendedWaitUntil:
    visible: "No caddy needed!"
    timeout: 45000

# Enable Score-only mode to restore single Next-press-per-hole navigation
# (the multi-phase stats flow requires multiple presses per hole otherwise)
- tapOn:
    id: "home-settings-link"

# Dismiss the "Settings guide" onboarding overlay (single step)
- extendedWaitUntil:
    visible:
      id: "done-button"
    timeout: 15000

# Complete the onboarding flow (single step)
- tapOn:
    text: ".*Done.*"
    index: 0
# Wait for the onboarding overlay to finish closing before the next tap
- extendedWaitUntil:
    notVisible:
      id: "done-button"
    timeout: 5000

# Wait for Settings to load (defaults to Golf tab)
- extendedWaitUntil:
    visible: "Score-only mode"
    timeout: 5000

# Turn on Score-only mode (a switch)
- tapOn:
    id: "score-only-switch"

# Wait for the switch to take effect
- waitForAnimationToEnd

# Return to Home screen (Settings is a stacked screen, not a tab — swipe from left edge to pop)
- swipe:
    direction: RIGHT
    duration: 300
- extendedWaitUntil:
    visible: "No caddy needed!"
    timeout: 10000

# Navigate to Play screen
- tapOn:
    id: "tab-play"

# Complete play onboarding (first-launch, two steps)
- tapOn:
    text: ".*Next.*"
    index: 0
- tapOn:
    text: ".*Done.*"
    index: 0
# Wait for the onboarding overlay to finish closing before the next tap
- extendedWaitUntil:
    notVisible:
      id: "done-button"
    timeout: 5000

# Wait for Start Round button
- extendedWaitUntil:
    visible:
      id: "start-button"
    timeout: 10000

# Open player setup
- tapOn:
    id: "start-button"

# Wait for course name input
- extendedWaitUntil:
    visible:
      id: "course-name-input"
    timeout: 5000

# Enter course name and start
- tapOn:
    id: "course-name-input"
- inputText: "E2E Test Course"
- hideKeyboard
- tapOn:
    id: "start-button"

# ------- Hole-by-hole scoring -------
# Par 4: 1,2,4,7,9,10,11,14,17,18
# Par 3: 3,6,12,15
# Par 5: 5,8,13,16

# Hole 1 — Par 4
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 10000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"

# Hole 2 — Par 4
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 5000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"

# Hole 3 — Par 3
- extendedWaitUntil:
    visible:
      id: "par-3-button"
    timeout: 5000
- tapOn:
    id: "par-3-button"
- tapOn:
    id: "next-hole-button"

# Hole 4 — Par 4
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 5000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"

# Hole 5 — Par 5
- extendedWaitUntil:
    visible:
      id: "par-5-button"
    timeout: 5000
- tapOn:
    id: "par-5-button"
- tapOn:
    id: "next-hole-button"

# Hole 6 — Par 3
- extendedWaitUntil:
    visible:
      id: "par-3-button"
    timeout: 5000
- tapOn:
    id: "par-3-button"
- tapOn:
    id: "next-hole-button"

# Hole 7 — Par 4
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 5000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"

# Hole 8 — Par 5
- extendedWaitUntil:
    visible:
      id: "par-5-button"
    timeout: 5000
- tapOn:
    id: "par-5-button"
- tapOn:
    id: "next-hole-button"

# Hole 9 — Par 4
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 5000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"

# Hole 10 — Par 4
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 5000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"

# Hole 11 — Par 4
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 5000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"

# Hole 12 — Par 3
- extendedWaitUntil:
    visible:
      id: "par-3-button"
    timeout: 5000
- tapOn:
    id: "par-3-button"
- tapOn:
    id: "next-hole-button"

# Hole 13 — Par 5
- extendedWaitUntil:
    visible:
      id: "par-5-button"
    timeout: 5000
- tapOn:
    id: "par-5-button"
- tapOn:
    id: "next-hole-button"

# Hole 14 — Par 4
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 5000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"

# Hole 15 — Par 3
- extendedWaitUntil:
    visible:
      id: "par-3-button"
    timeout: 5000
- tapOn:
    id: "par-3-button"
- tapOn:
    id: "next-hole-button"

# Hole 16 — Par 5
- extendedWaitUntil:
    visible:
      id: "par-5-button"
    timeout: 5000
- tapOn:
    id: "par-5-button"
- tapOn:
    id: "next-hole-button"

# Hole 17 — Par 4
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 5000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"

# Hole 18 — Par 4 (next-hole-button triggers end-round confirmation)
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 5000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"

# ------- End round -------
# Saving the round opens its summary; dismiss it to return to the Play screen
- extendedWaitUntil:
    visible:
      id: "end-round-save-button"
    timeout: 5000
- tapOn:
    id: "end-round-save-button"
# The summary scrolls: bring "View in Stats" into view and open it
- scrollUntilVisible:
    element:
      id: "round-summary-performance-button"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "round-summary-performance-button"

# "View in Stats" opens the Stats guide straight away: dismiss it
- extendedWaitUntil:
    visible:
      id: "done-button"
    timeout: 15000
- tapOn:
    id: "done-button"
- extendedWaitUntil:
    notVisible:
      id: "done-button"
    timeout: 5000

# Open the newest round from Round history to see its scorecard
- scrollUntilVisible:
    element:
      id: "round-history-row-.*"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "round-history-row-.*"
    index: 0

# Assert the round summary is displayed
- extendedWaitUntil:
    visible:
      id: "round-summary-card"
    timeout: 10000

# Assert par for the out holes (par 3: 3, 6; par 5: 5, 8; par 4: 1)
- assertVisible:
    id: "round-table-par-3"
    text: "3"
- assertVisible:
    id: "round-table-par-6"
    text: "3"
- assertVisible:
    id: "round-table-par-5"
    text: "5"
- assertVisible:
    id: "round-table-par-8"
    text: "5"
- assertVisible:
    id: "round-table-par-1"
    text: "4"

# Scroll to the in holes (par 3: 12, 15; par 5: 13, 16)
- scrollUntilVisible:
    element:
      id: "round-table-par-12"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "round-table-par-12"
    text: "3"
- assertVisible:
    id: "round-table-par-15"
    text: "3"
- assertVisible:
    id: "round-table-par-13"
    text: "5"
- assertVisible:
    id: "round-table-par-16"
    text: "5"

# Assert the round total is 72 (scores reset to par on each hole)
- assertVisible:
    id: "round-summary-score"
    text: "72"
