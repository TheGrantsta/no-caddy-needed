appId: com.grantsta.golf.nocaddyneeded
---
# E2E: Multi-step stats flow with deadly sins
# Tests that the stats flow (score → stats → sin details → putting → next hole) works correctly
# when deadly sins (Trouble off tee, Bogeys inside 9-iron) are selected with clubs available.

# Launch fresh — clears DB and app state
- launchApp:
    clearState: true

# ======== HOME ONBOARDING ========
# Wait for home onboarding (first-launch, single step)
- extendedWaitUntil:
    visible:
      id: "done-button"
    timeout: 90000

# Complete home onboarding (single step)
- tapOn:
    id: "done-button"

# Wait for home screen
- extendedWaitUntil:
    visible: "No caddy needed!"
    timeout: 45000

# ======== ADD CLUBS ========
# Navigate to Play screen (do NOT enable Score-only mode; we need the multi-step stats flow)
- tapOn:
    id: "tab-play"

# Complete play onboarding (two steps)
- tapOn:
    id: "next-button"
- tapOn:
    id: "done-button"

# Wait for Play screen to be ready
# Play onboarding overlay may appear; wait for start-button to ensure it's behind/dismissed
- extendedWaitUntil:
    visible:
      id: "start-button"
    timeout: 20000

# Navigate to Distances from My Bag
- tapOn:
    id: "tab-my-bag"
- tapOn:
    id: "bag-row-distances"

# Distances opens with onboarding (empty list, first visit, single step)
- extendedWaitUntil:
    visible:
      id: "done-button"
    timeout: 5000
- tapOn:
    id: "done-button"

# Distances opens read-only: switch to editing before adding clubs
- extendedWaitUntil:
    visible:
      id: "edit-distances-button"
    timeout: 5000
- tapOn:
    id: "edit-distances-button"
- extendedWaitUntil:
    visible:
      id: "add-club-button"
    timeout: 5000

# Add two clubs: Driver (250) and 9 Iron (140)
- tapOn:
    id: "add-club-button"
- tapOn:
    id: "add-club-button"

# Fill in club data - Driver
- tapOn:
    id: "club-input-0"
- inputText: "Driver"
- tapOn:
    id: "distance-input-0"
- inputText: "250"
- hideKeyboard

# Fill in club data - 9 iron
- tapOn:
    id: "club-input-1"
- inputText: "9 iron"
- tapOn:
    id: "distance-input-1"
- inputText: "140"
- hideKeyboard

# Save the distances with Done
- tapOn:
    id: "distances-done-button"

# Return to My Bag, then open the Play tab
- tapOn:
    id: "distances-back-button"
- tapOn:
    id: "tab-play"
- extendedWaitUntil:                                                                                                                          
    visible:                                                                                                                                  
        id: "start-button"                                                                                                                
    timeout: 5000

# Start round
- tapOn:
    id: "start-button"

# Wait for course name input
- extendedWaitUntil:
    visible:
      id: "course-name-input"
    timeout: 5000

# Enter course name and start
- tapOn:
    id: "course-name-input"
- inputText: "Stats Flow Test Course"
- hideKeyboard
- tapOn:
    id: "start-button"

# Hole 1 — Par 4
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 10000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"

# Select trouble off tee
- extendedWaitUntil:
    visible:
      id: "7deadly-sins-toggle-trouble-off-tee"
    timeout: 5000
- tapOn:
    id: "7deadly-sins-toggle-trouble-off-tee"
- tapOn:
    id: "next-hole-button"

# Regression test: Select club for trouble off tee (this used to crash)
- extendedWaitUntil:
    visible:
      id: "club-picker-dropdown-toggle"
    timeout: 5000
- tapOn:
    id: "club-picker-dropdown-toggle"

# Wait for dropdown to show options
- extendedWaitUntil:
    visible:
      id: "club-picker-option-Driver"
    timeout: 3000
- tapOn:
    id: "club-picker-option-Driver"

# Driver is now selected in the dropdown - move to putting screen
- tapOn:
    id: "next-hole-button"

# Enter first putt
- extendedWaitUntil:
    visible:
      id: "first-putt-input"
    timeout: 3000
- tapOn:
    id: "first-putt-input"
- tapOn:
    id: "first-putt-input-option-1"

# GIR defaults to No
- assertVisible:
    id: "gir-toggle-no-selected"
- assertNotVisible:
    id: "gir-toggle-yes-selected"

# Complete the hole
- extendedWaitUntil:
    visible:
      id: "next-hole-button"
    timeout: 10000
- tapOn:
    id: "next-hole-button"

# Hole 2 — Par 4
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 10000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"

# Select penalty
- extendedWaitUntil:
    visible:
      id: "7deadly-sins-toggle-penalties"
    timeout: 5000
- tapOn:
    id: "7deadly-sins-toggle-penalties"
- tapOn:
    id: "next-hole-button"

# Regression test: Select club for trouble off tee (this used to crash)
- extendedWaitUntil:
    visible:
      id: "penalty-type-picker-dropdown-toggle"
    timeout: 5000
- tapOn:
    id: "penalty-type-picker-dropdown-toggle"

# Wait for dropdown to show options
- extendedWaitUntil:
    visible:
      id: "penalty-type-picker-option-Out of bounds"
    timeout: 3000
- tapOn:
    id: "penalty-type-picker-option-Out of bounds"

# Driver is now selected in the dropdown - move to putting screen
- tapOn:
    id: "next-hole-button"

# Hole hit in regulation (tap before typing so no keyboard is open)
- extendedWaitUntil:
    visible:
      id: "gir-toggle-yes"
    timeout: 3000
- tapOn:
    id: "gir-toggle-yes"
# Wait for the selected state to render; assertVisible does not retry
- extendedWaitUntil:
    visible:
      id: "gir-toggle-yes-selected"
    timeout: 3000

# Enter first putt
- extendedWaitUntil:
    visible:
      id: "first-putt-input"
    timeout: 3000
- tapOn:
    id: "first-putt-input"
- tapOn:
    id: "first-putt-input-option-2"

# Complete the hole
- extendedWaitUntil:
    visible:
      id: "next-hole-button"
    timeout: 10000
- tapOn:
    id: "next-hole-button"

# Hole 3 — Par 4
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 10000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"

# Select penalty
- extendedWaitUntil:
    visible:
      id: "7deadly-sins-toggle-three-putts"
    timeout: 5000
- tapOn:
    id: "7deadly-sins-toggle-three-putts"
- tapOn:
    id: "next-hole-button"

# Enter first putt
- extendedWaitUntil:
    visible:
      id: "first-putt-input"
    timeout: 3000
- tapOn:
    id: "first-putt-input"
- tapOn:
    id: "first-putt-input-option-3"

# Enter second putt
- extendedWaitUntil:
    visible:
      id: "second-putt-input"
    timeout: 3000
- tapOn:
    id: "second-putt-input"
- tapOn:
    id: "second-putt-input-option-2"
# Number pad has no Return key, so tap the header to make sure the keyboard is closed before Next
- tapOn:
    text: "Hole .* — Putting stats"

# Entering putts must not change GIR
- assertVisible:
    id: "gir-toggle-no-selected"

# Keyboard was already closed by the header tap, so a single Next moves on
- extendedWaitUntil:
    visible:
      id: "next-hole-button"
    timeout: 10000
- tapOn:
    id: "next-hole-button"

# Hole 4 — Par 4
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 10000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"

# Select penalty
- extendedWaitUntil:
    visible:
      id: "7deadly-sins-toggle-bogeys-inside-9iron"
    timeout: 5000
- tapOn:
    id: "7deadly-sins-toggle-bogeys-inside-9iron"
- tapOn:
    id: "next-hole-button"

# Regression test: Select club for bogeys inside 9-iron sin
- extendedWaitUntil:
    visible:
      id: "bogeys-club-picker-dropdown-toggle"
    timeout: 5000
- tapOn:
    id: "bogeys-club-picker-dropdown-toggle"

# Wait for dropdown to show options
- extendedWaitUntil:
    visible:
      id: "bogeys-club-picker-option-9 iron"
    timeout: 3000
- tapOn:
    id: "bogeys-club-picker-option-9 iron"

# 9 iron is now selected in the dropdown - move to putting screen
- tapOn:
    id: "next-hole-button"

# Enter first putt
- extendedWaitUntil:
    visible:
      id: "first-putt-input"
    timeout: 3000
- tapOn:
    id: "first-putt-input"
- tapOn:
    id: "first-putt-input-option-4"

# Complete the hole
- extendedWaitUntil:
    visible:
      id: "next-hole-button"
    timeout: 10000
- tapOn:
    id: "next-hole-button"

# Hole 5 — Par 4
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 10000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"

# Select penalty
- extendedWaitUntil:
    visible:
      id: "7deadly-sins-toggle-double-chips"
    timeout: 5000
- tapOn:
    id: "7deadly-sins-toggle-double-chips"
- tapOn:
    id: "next-hole-button"

# Regression test: select double chips reason
- extendedWaitUntil:
    visible:
      id: "double-chip-reason-picker-dropdown-toggle"
    timeout: 5000
- tapOn:
    id: "double-chip-reason-picker-dropdown-toggle"

# Wait for dropdown to show options
- extendedWaitUntil:
    visible:
      id: "double-chip-reason-picker-option-Short sided"
    timeout: 3000
- tapOn:
    id: "double-chip-reason-picker-option-Short sided"

# Driver is now selected in the dropdown - move to putting screen
- tapOn:
    id: "next-hole-button"

# Enter first putt
- extendedWaitUntil:
    visible:
      id: "first-putt-input"
    timeout: 3000
- tapOn:
    id: "first-putt-input"
- tapOn:
    id: "first-putt-input-option-5"

# Complete the hole
- extendedWaitUntil:
    visible:
      id: "next-hole-button"
    timeout: 10000
- tapOn:
    id: "next-hole-button"

# ------- End round -------
# On the hole screen the link is "end-round-button"; "end-incomplete-round-link" is the Play start screen's link
- extendedWaitUntil:
    visible:
      id: "end-round-button"
    timeout: 5000
- tapOn:
    id: "end-round-button"
    
- extendedWaitUntil:
    visible:
      id: "end-round-save-button"
    timeout: 5000
- tapOn:
    id: "end-round-save-button"
# The summary scrolls, so bring the Done button into view first
- scrollUntilVisible:
    element:
      id: "round-summary-done-button"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "round-summary-done-button"

# ======== UP AND DOWN ON PERFORM ========
# Missed greens: holes 1, 3, 4, 5 (hole 2 was in regulation).
# One-putts from a missed green: holes 1, 4, 5 => 3 of 4 = 75%.
- tapOn:
    id: "tab-home"
- tapOn:
    id: "tab-perform"

# Dismiss the Perform onboarding (single step, same as screenshots.yaml)
- extendedWaitUntil:
    visible:
      id: "done-button"
    timeout: 15000
- tapOn:
    id: "done-button"

- tapOn: "Proximity"
- extendedWaitUntil:
    visible:
      id: "up-and-down-rate"
    timeout: 5000
- assertVisible:
    id: "up-and-down-rate"
    text: "75%"
- assertVisible:
    id: "up-and-down-detail"
    text: "3 of 4 missed greens"

# ======== CHALLENGES ========
# Each challenge screen must load (regression: navigation hooks threw on render after the SDK 58 upgrade),
# expose its back button, and leave through the quit confirmation back to the Practice cards.
- tapOn:
    id: "tab-home"
- tapOn:
    id: "tab-practice"
- extendedWaitUntil:
    visible:
      id: "done-button"
    timeout: 15000
- tapOn:
    id: "done-button"

- extendedWaitUntil:
    visible:
      id: "challenge-link-putting-simulation"
    timeout: 5000
- tapOn:
    id: "challenge-link-putting-simulation"
- extendedWaitUntil:
    visible:
      id: "header-back-button"
    timeout: 5000
- tapOn:
    id: "header-back-button"
- extendedWaitUntil:
    visible:
      id: "confirm-quit-button"
    timeout: 5000
- tapOn:
    id: "confirm-quit-button"
- extendedWaitUntil:
    visible:
      id: "challenge-link-putting-simulation"
    timeout: 5000

- extendedWaitUntil:
    visible:
      id: "challenge-link-up-and-down"
    timeout: 5000
- tapOn:
    id: "challenge-link-up-and-down"
- extendedWaitUntil:
    visible:
      id: "header-back-button"
    timeout: 5000
- tapOn:
    id: "header-back-button"
- extendedWaitUntil:
    visible:
      id: "confirm-quit-button"
    timeout: 5000
- tapOn:
    id: "confirm-quit-button"
- extendedWaitUntil:
    visible:
      id: "challenge-link-up-and-down"
    timeout: 5000

- extendedWaitUntil:
    visible:
      id: "challenge-link-short-putting-ladder"
    timeout: 5000
- tapOn:
    id: "challenge-link-short-putting-ladder"
- extendedWaitUntil:
    visible:
      id: "header-back-button"
    timeout: 5000
- tapOn:
    id: "header-back-button"
- extendedWaitUntil:
    visible:
      id: "confirm-quit-button"
    timeout: 5000
- tapOn:
    id: "confirm-quit-button"
- extendedWaitUntil:
    visible:
      id: "challenge-link-short-putting-ladder"
    timeout: 5000

- extendedWaitUntil:
    visible:
      id: "challenge-link-lag-putting"
    timeout: 5000
- tapOn:
    id: "challenge-link-lag-putting"
- extendedWaitUntil:
    visible:
      id: "header-back-button"
    timeout: 5000
- tapOn:
    id: "header-back-button"
- extendedWaitUntil:
    visible:
      id: "confirm-quit-button"
    timeout: 5000
- tapOn:
    id: "confirm-quit-button"
- extendedWaitUntil:
    visible:
      id: "challenge-link-lag-putting"
    timeout: 5000
