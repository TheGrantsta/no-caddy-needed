appId: com.grantsta.golf.nocaddyneeded
---
# E2E: Multi-step stats flow with deadly sins
# Tests that the stats flow (score → stats → sin details → putting → next hole) works correctly
# when deadly sins (Trouble off tee, Bogeys inside 9-iron) are selected with clubs available.

# Launch fresh — clears DB and app state
- launchApp:
    clearState: true

# ======== HOME ONBOARDING ========
# Wait for home onboarding (first-launch, single step)
- extendedWaitUntil:
    visible:
      id: "done-button"
    timeout: 90000

# Complete home onboarding (single step)
- tapOn:
    id: "done-button"
# Wait for the onboarding overlay to finish closing before the next tap
- extendedWaitUntil:
    notVisible:
      id: "done-button"
    timeout: 5000

# Wait for home screen
- extendedWaitUntil:
    visible: "No caddy needed!"
    timeout: 45000

# ======== ADD CLUBS ========
# Navigate to Play screen (do NOT enable Score-only mode; we need the multi-step stats flow)
- tapOn:
    id: "tab-play"

# Complete play onboarding (two steps)
- tapOn:
    id: "next-button"
- tapOn:
    id: "done-button"
# Wait for the onboarding overlay to finish closing before the next tap
- extendedWaitUntil:
    notVisible:
      id: "done-button"
    timeout: 5000

# Wait for Play screen to be ready
# Play onboarding overlay may appear; wait for start-button to ensure it's behind/dismissed
- extendedWaitUntil:
    visible:
      id: "start-button"
    timeout: 20000

# Navigate to Distances from My Bag
- tapOn:
    id: "tab-my-bag"
- tapOn:
    id: "bag-row-distances"

# Distances opens with onboarding (empty list, first visit, single step)
- extendedWaitUntil:
    visible:
      id: "done-button"
    timeout: 5000
- tapOn:
    id: "done-button"
# Wait for the onboarding overlay to finish closing before the next tap
- extendedWaitUntil:
    notVisible:
      id: "done-button"
    timeout: 5000

# Distances opens read-only: switch to editing before adding clubs
- extendedWaitUntil:
    visible:
      id: "edit-distances-button"
    timeout: 5000
- tapOn:
    id: "edit-distances-button"
- extendedWaitUntil:
    visible:
      id: "add-club-button"
    timeout: 5000

# Add two clubs: Driver (250) and 9 Iron (140)
- tapOn:
    id: "add-club-button"
- tapOn:
    id: "add-club-button"

# Fill in club data - Driver
- tapOn:
    id: "club-input-0"
- inputText: "Driver"
- tapOn:
    id: "distance-input-0"
- inputText: "250"
- hideKeyboard

# Fill in club data - 9 iron
- tapOn:
    id: "club-input-1"
- inputText: "9 iron"
- tapOn:
    id: "distance-input-1"
- inputText: "140"
- hideKeyboard

# Total distances: Driver 275, 9 iron 150
- tapOn:
    id: "total-input-0"
- inputText: "275"
- hideKeyboard
- tapOn:
    id: "total-input-1"
- inputText: "150"
- hideKeyboard

# Number pad has no Return key, so tap the title to make sure the keyboard is closed,
# otherwise the first tap on Done only dismisses the keyboard
- tapOn:
    text: "Distances"
    index: 0

# Save the distances with Done, then wait until the list is back to read-only (the Edit button returns)
- tapOn:
    id: "distances-done-button"
- extendedWaitUntil:
    visible:
      id: "edit-distances-button"
    timeout: 10000

# Go back from the Distances list using its Back button
- tapOn:
    id: "distances-back-button"

# Open the Play tab
- tapOn:
    id: "tab-play"
- extendedWaitUntil:                                                                                                                          
    visible:                                                                                                                                  
        id: "start-button"                                                                                                                
    timeout: 5000

# Start round
- tapOn:
    id: "start-button"

# Wait for course name input
- extendedWaitUntil:
    visible:
      id: "course-name-input"
    timeout: 5000

# Enter course name and start
- tapOn:
    id: "course-name-input"
- inputText: "Stats Flow Test Course"
- hideKeyboard
- tapOn:
    id: "start-button"

# Hole 1 — Par 4 (one page: putting, sins and Next are all on the same scrolling screen)
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 10000
- tapOn:
    id: "par-4-button"
# Enter first putt
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "first-putt-input"
- extendedWaitUntil:
    visible: "1 ft"
    timeout: 5000
- tapOn: "1 ft"
# Select the deadly sin
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "7deadly-sins-toggle-trouble-off-tee"
# Choose the detail under the sin
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "club-picker-dropdown-toggle"
- extendedWaitUntil:
    visible: "Driver"
    timeout: 3000
- tapOn: "Driver"
# Complete the hole
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "next-hole-button"


# Hole 2 — Par 4 (one page: putting, sins and Next are all on the same scrolling screen)
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 10000
- tapOn:
    id: "par-4-button"
# Enter first putt
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "first-putt-input"
- extendedWaitUntil:
    visible: "2 ft"
    timeout: 5000
- tapOn: "2 ft"
# Hole hit in regulation
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "gir-switch"
# Select the deadly sin
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "7deadly-sins-toggle-penalties"
# Choose the detail under the sin
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "penalty-type-picker-dropdown-toggle"
- extendedWaitUntil:
    visible: "Out of bounds"
    timeout: 3000
- tapOn: "Out of bounds"
# Complete the hole
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "next-hole-button"


# Hole 3 — Par 4 (one page: putting, sins and Next are all on the same scrolling screen)
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 10000
- tapOn:
    id: "par-4-button"
# Enter first putt
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "first-putt-input"
- extendedWaitUntil:
    visible: "3 ft"
    timeout: 5000
- tapOn: "3 ft"
# Enter second putt
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "second-putt-input"
- extendedWaitUntil:
    visible: "1 ft"
    timeout: 5000
- tapOn: "1 ft"
# Select the deadly sin
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "7deadly-sins-toggle-three-putts"
# Complete the hole
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "next-hole-button"


# Hole 4 — Par 4 (one page: putting, sins and Next are all on the same scrolling screen)
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 10000
- tapOn:
    id: "par-4-button"
# Enter first putt
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "first-putt-input"
- extendedWaitUntil:
    visible: "2 ft"
    timeout: 5000
- tapOn: "2 ft"
# Select the deadly sin
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "7deadly-sins-toggle-bogeys-inside-9iron"
# Choose the detail under the sin
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "bogeys-club-picker-dropdown-toggle"
- extendedWaitUntil:
    visible: "9 iron"
    timeout: 3000
- tapOn: "9 iron"
# Complete the hole
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "next-hole-button"


# Hole 5 — Par 4 (one page: putting, sins and Next are all on the same scrolling screen)
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 10000
- tapOn:
    id: "par-4-button"
# Enter first putt
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "first-putt-input"
- extendedWaitUntil:
    visible: "3 ft"
    timeout: 5000
- tapOn: "3 ft"
# Select the deadly sin
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "7deadly-sins-toggle-double-chips"
# Choose the detail under the sin
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "double-chip-reason-picker-dropdown-toggle"
- extendedWaitUntil:
    visible: "Short sided"
    timeout: 3000
- tapOn: "Short sided"
# Complete the hole
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "next-hole-button"

# ------- End round -------
# On the hole screen the link is "end-round-button"; "end-incomplete-round-link" is the Play start screen's link
- extendedWaitUntil:
    visible:
      id: "end-round-button"
    timeout: 5000
- tapOn:
    id: "end-round-button"
    
- extendedWaitUntil:
    visible:
      id: "end-round-save-button"
    timeout: 5000
- tapOn:
    id: "end-round-save-button"
# The summary scrolls, so bring the Done button into view first
- runFlow:
    file: subflows/tap-in-page.yaml
    env:
      ID: "round-summary-done-button"

# ======== UP AND DOWN ON PERFORM ========
# Missed greens: holes 1, 3, 4, 5 (hole 2 was in regulation).
# One-putts from a missed green: holes 1, 4, 5 => 3 of 4 = 75%.
- tapOn:
    id: "tab-home"
- tapOn:
    id: "tab-perform"

# Dismiss the Perform onboarding (single step, same as screenshots.yaml)
- extendedWaitUntil:
    visible:
      id: "done-button"
    timeout: 15000
- tapOn:
    id: "done-button"
# Wait for the onboarding overlay to finish closing before the next tap
- extendedWaitUntil:
    notVisible:
      id: "done-button"
    timeout: 5000

- tapOn: "Proximity"
- extendedWaitUntil:
    visible:
      id: "up-and-down-rate"
    timeout: 5000
- assertVisible:
    id: "up-and-down-rate"
    text: "100%"
- assertVisible:
    id: "up-and-down-detail"
    text: "3 of 3 missed greens"
