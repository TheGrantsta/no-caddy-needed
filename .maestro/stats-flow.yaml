appId: com.grantsta.golf.nocaddyneeded
---
# E2E: Multi-step stats flow with deadly sins
# Tests that the stats flow (score → stats → sin details → putting → next hole) works correctly
# when deadly sins (Trouble off tee, Bogeys inside 9-iron) are selected with clubs available.

# Launch fresh — clears DB and app state
- launchApp:
    clearState: true

# ======== HOME ONBOARDING ========
# Wait for home onboarding (first-launch)
- extendedWaitUntil:
    visible:
      id: "next-button"
    timeout: 90000

# Complete home onboarding (2 steps, then done)
- tapOn:
    id: "next-button"
- tapOn:
    id: "next-button"
- tapOn:
    id: "done-button"

# Wait for home screen
- extendedWaitUntil:
    visible: "No caddy needed!"
    timeout: 45000

# ======== ADD CLUBS ========
# Navigate to Play screen (do NOT enable Score-only mode; we need the multi-step stats flow)
- tapOn:
    id: "home-play-link"

# Complete play onboarding (2 steps, then done)
- tapOn:
    id: "next-button"
- tapOn:
    id: "next-button"
- tapOn:
    id: "done-button"

# Wait for Play screen to be ready
# Play onboarding overlay may appear; wait for start-round-button to ensure it's behind/dismissed
- extendedWaitUntil:
    visible:
      id: "start-round-button"
    timeout: 20000

# Navigate to Distances via SubMenu
- tapOn:
    id: "play-sub-menu-distances"

# Distances opens with onboarding (empty list, first visit)
- extendedWaitUntil:
    visible:
      id: "next-button"
    timeout: 5000
- tapOn:
    id: "next-button"
- tapOn:
    id: "next-button"
- tapOn:
    id: "done-button"

# Wait for Distances list
- extendedWaitUntil:
    visible:
      id: "add-club-button"
    timeout: 5000

# Add two clubs: Driver (250) and 9 Iron (140)
- tapOn:
    id: "add-club-button"
- tapOn:
    id: "add-club-button"

# Fill in club data - Driver
- tapOn:
    id: "club-input-0"
- inputText: "Driver"
- tapOn:
    id: "distance-input-0"
- inputText: "250"
- hideKeyboard

# Fill in club data - 9 iron
- tapOn:
    id: "club-input-1"
- inputText: "9 iron"
- tapOn:
    id: "distance-input-1"
- inputText: "140"
- hideKeyboard

# Wait for keyboard to fully dismiss and form to settle
- extendedWaitUntil:
    visible:
      id: "save-distances-button"
    timeout: 3000

# Ensure both club rows are visible (form is stable)
- extendedWaitUntil:
    visible: "Driver"
    timeout: 2000
- extendedWaitUntil:
    visible: "9 iron"
    timeout: 2000

# Verify the inputs are populated with correct values before saving
- extendedWaitUntil:
    visible: "250"
    timeout: 2000
- extendedWaitUntil:
    visible: "140"
    timeout: 2000

# Double-tap the save button in case the first tap didn't register
- tapOn:
    id: "save-distances-button"

# Wait briefly and tap again if needed
- tapOn:
    id: "save-distances-button"

# Wait for the save operation to complete
- extendedWaitUntil:
    visible:
      id: "play-sub-menu-score"
    timeout: 5000

# Navigate to play screen
- tapOn:
    id: "play-sub-menu-score"                                                                                                                 
- extendedWaitUntil:                                                                                                                          
    visible:                                                                                                                                  
        id: "start-round-button"                                                                                                                
    timeout: 5000

# Start round
- tapOn:
    id: "start-round-button"

# Wait for course name input
- extendedWaitUntil:
    visible:
      id: "course-name-input"
    timeout: 5000

# Enter course name and start
- tapOn:
    id: "course-name-input"
- inputText: "Stats Flow Test Course"
- hideKeyboard
- tapOn:
    id: "start-button"

# Navigate back to Distances screen
- tapOn:
    id: "play-sub-menu-distances"
- extendedWaitUntil:
    visible: "Carry distance, not total"
    timeout: 5000

# Navigate back to play screen
- tapOn:
    id: "play-sub-menu-score"

# Hole 1 — Par 4
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 10000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"