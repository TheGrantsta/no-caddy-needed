appId: com.grantsta.golf.nocaddyneeded
---
# E2E: Multi-step stats flow with deadly sins
# Tests that the stats flow (score → stats → sin details → putting → next hole) works correctly
# when deadly sins (Trouble off tee, Bogeys inside 9-iron) are selected with clubs available.

# Launch fresh — clears DB and app state
- launchApp:
    clearState: true

# ======== HOME ONBOARDING ========
# Wait for home onboarding (first-launch)
- extendedWaitUntil:
    visible:
      id: "next-button"
    timeout: 90000

# Complete home onboarding (2 steps, then done)
- tapOn:
    id: "next-button"
- tapOn:
    id: "next-button"
- tapOn:
    id: "done-button"

# Wait for home screen
- extendedWaitUntil:
    visible: "No caddy needed!"
    timeout: 45000

# ======== ADD CLUBS ========
# Navigate to Play screen (do NOT enable Score-only mode; we need the multi-step stats flow)
- tapOn:
    id: "home-play-link"

# Complete play onboarding (2 steps, then done)
- tapOn:
    id: "next-button"
- tapOn:
    id: "next-button"
- tapOn:
    id: "done-button"

# Wait for Play screen to be ready
# Play onboarding overlay may appear; wait for start-round-button to ensure it's behind/dismissed
- extendedWaitUntil:
    visible:
      id: "start-round-button"
    timeout: 20000

# Navigate to Distances via SubMenu
- tapOn:
    id: "play-sub-menu-distances"

# Distances opens with onboarding (empty list, first visit)
- extendedWaitUntil:
    visible:
      id: "next-button"
    timeout: 5000
- tapOn:
    id: "next-button"
- tapOn:
    id: "next-button"
- tapOn:
    id: "done-button"

# Wait for Distances list
- extendedWaitUntil:
    visible:
      id: "add-club-button"
    timeout: 5000

# Add two clubs: Driver (250) and 9 Iron (140)
- tapOn:
    id: "add-club-button"
- tapOn:
    id: "add-club-button"

# Fill in club data - Driver
- tapOn:
    id: "club-input-0"
- inputText: "Driver"
- tapOn:
    id: "distance-input-0"
- inputText: "250"
- hideKeyboard

# Fill in club data - 9 iron
- tapOn:
    id: "club-input-1"
- inputText: "9 iron"
- tapOn:
    id: "distance-input-1"
- inputText: "140"
- hideKeyboard

# Double-tap the save button in case the first tap didn't register
- tapOn:
    id: "save-distances-button"

# Wait briefly and tap again if needed
- tapOn:
    id: "save-distances-button"

# Wait for the save operation to complete
- extendedWaitUntil:
    visible:
      id: "play-sub-menu-score"
    timeout: 5000

# Navigate to play screen
- tapOn:
    id: "play-sub-menu-score"                                                                                                                 
- extendedWaitUntil:                                                                                                                          
    visible:                                                                                                                                  
        id: "start-round-button"                                                                                                                
    timeout: 5000

# Start round
- tapOn:
    id: "start-round-button"

# Wait for course name input
- extendedWaitUntil:
    visible:
      id: "course-name-input"
    timeout: 5000

# Enter course name and start
- tapOn:
    id: "course-name-input"
- inputText: "Stats Flow Test Course"
- hideKeyboard
- tapOn:
    id: "start-button"

# Navigate back to Distances screen
- tapOn:
    id: "play-sub-menu-distances"
- extendedWaitUntil:
    visible: "Carry distance, not total"
    timeout: 5000

# Navigate back to play screen
- tapOn:
    id: "play-sub-menu-score"

# Hole 1 — Par 4
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 10000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"

# Select trouble off tee
- extendedWaitUntil:
    visible:
      id: "7deadly-sins-toggle-trouble-off-tee"
    timeout: 5000
- tapOn:
    id: "7deadly-sins-toggle-trouble-off-tee"
- tapOn:
    id: "next-hole-button"

# Regression test: Select club for trouble off tee (this used to crash)
- extendedWaitUntil:
    visible:
      id: "club-picker-dropdown-toggle"
    timeout: 5000
- tapOn:
    id: "club-picker-dropdown-toggle"

# Wait for dropdown to show options
- extendedWaitUntil:
    visible:
      id: "club-picker-option-Driver"
    timeout: 3000
- tapOn:
    id: "club-picker-option-Driver"

# Driver is now selected in the dropdown - move to putting screen
- tapOn:
    id: "next-hole-button"

# Enter first putt
- extendedWaitUntil:
    visible:
      id: "first-putt-input"
    timeout: 3000
- tapOn:
    id: "first-putt-input"
- inputText: "1"
- hideKeyboard

# Complete the hole
- extendedWaitUntil:
    visible:
      id: "next-hole-button"
    timeout: 10000
- tapOn:
    id: "next-hole-button"
- tapOn:
    id: "next-hole-button"

# Hole 2 — Par 4
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 10000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"

# Select penalty
- extendedWaitUntil:
    visible:
      id: "7deadly-sins-toggle-penalties"
    timeout: 5000
- tapOn:
    id: "7deadly-sins-toggle-penalties"
- tapOn:
    id: "next-hole-button"

# Regression test: Select club for trouble off tee (this used to crash)
- extendedWaitUntil:
    visible:
      id: "penalty-type-picker-dropdown-toggle"
    timeout: 5000
- tapOn:
    id: "penalty-type-picker-dropdown-toggle"

# Wait for dropdown to show options
- extendedWaitUntil:
    visible:
      id: "penalty-type-picker-option-Out of bounds"
    timeout: 3000
- tapOn:
    id: "penalty-type-picker-option-Out of bounds"

# Driver is now selected in the dropdown - move to putting screen
- tapOn:
    id: "next-hole-button"

# Enter first putt
- extendedWaitUntil:
    visible:
      id: "first-putt-input"
    timeout: 3000
- tapOn:
    id: "first-putt-input"
- inputText: "2"
- hideKeyboard

# Complete the hole
- extendedWaitUntil:
    visible:
      id: "next-hole-button"
    timeout: 10000
- tapOn:
    id: "next-hole-button"
- tapOn:
    id: "next-hole-button"

# Hole 3 — Par 4
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 10000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"

# Select penalty
- extendedWaitUntil:
    visible:
      id: "7deadly-sins-toggle-three-putts"
    timeout: 5000
- tapOn:
    id: "7deadly-sins-toggle-three-putts"
- tapOn:
    id: "next-hole-button"

# Enter first putt
- extendedWaitUntil:
    visible:
      id: "first-putt-input"
    timeout: 3000
- tapOn:
    id: "first-putt-input"
- inputText: "3"
- hideKeyboard

# Enter second putt
- extendedWaitUntil:
    visible:
      id: "second-putt-input"
    timeout: 3000
- tapOn:
    id: "second-putt-input"
- inputText: "2"
- hideKeyboard

# Complete the hole
- extendedWaitUntil:
    visible:
      id: "next-hole-button"
    timeout: 10000
- tapOn:
    id: "next-hole-button"
- tapOn:
    id: "next-hole-button"

# Hole 4 — Par 4
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 10000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"

# Select penalty
- extendedWaitUntil:
    visible:
      id: "7deadly-sins-toggle-bogeys-inside-9iron"
    timeout: 5000
- tapOn:
    id: "7deadly-sins-toggle-bogeys-inside-9iron"
- tapOn:
    id: "next-hole-button"

# Regression test: Select club for bogeys inside 9-iron sin
- extendedWaitUntil:
    visible:
      id: "bogeys-club-picker-dropdown-toggle"
    timeout: 5000
- tapOn:
    id: "bogeys-club-picker-dropdown-toggle"

# Wait for dropdown to show options
- extendedWaitUntil:
    visible:
      id: "bogeys-club-picker-option-9 iron"
    timeout: 3000
- tapOn:
    id: "bogeys-club-picker-option-9 iron"

# 9 iron is now selected in the dropdown - move to putting screen
- tapOn:
    id: "next-hole-button"

# Enter first putt
- extendedWaitUntil:
    visible:
      id: "first-putt-input"
    timeout: 3000
- tapOn:
    id: "first-putt-input"
- inputText: "4"
- hideKeyboard

# Complete the hole
- extendedWaitUntil:
    visible:
      id: "next-hole-button"
    timeout: 10000
- tapOn:
    id: "next-hole-button"
- tapOn:
    id: "next-hole-button"

# Hole 5 — Par 4
- extendedWaitUntil:
    visible:
      id: "par-4-button"
    timeout: 10000
- tapOn:
    id: "par-4-button"
- tapOn:
    id: "next-hole-button"

# Select penalty
- extendedWaitUntil:
    visible:
      id: "7deadly-sins-toggle-double-chips"
    timeout: 5000
- tapOn:
    id: "7deadly-sins-toggle-double-chips"
- tapOn:
    id: "next-hole-button"

# Regression test: select double chips reason
- extendedWaitUntil:
    visible:
      id: "double-chip-reason-picker-dropdown-toggle"
    timeout: 5000
- tapOn:
    id: "double-chip-reason-picker-dropdown-toggle"

# Wait for dropdown to show options
- extendedWaitUntil:
    visible:
      id: "double-chip-reason-picker-option-Short sided"
    timeout: 3000
- tapOn:
    id: "double-chip-reason-picker-option-Short sided"

# Driver is now selected in the dropdown - move to putting screen
- tapOn:
    id: "next-hole-button"

# Enter first putt
- extendedWaitUntil:
    visible:
      id: "first-putt-input"
    timeout: 3000
- tapOn:
    id: "first-putt-input"
- inputText: "5"
- hideKeyboard

# Complete the hole
- extendedWaitUntil:
    visible:
      id: "next-hole-button"
    timeout: 10000
- tapOn:
    id: "next-hole-button"
- tapOn:
    id: "next-hole-button"