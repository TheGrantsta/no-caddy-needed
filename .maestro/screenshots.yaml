appId: com.grantsta.golf.nocaddyneeded
---
# Google Play Screenshot Flow
# Captures key screens for app store listing

# Reset app to home screen
- launchApp:
    clearState: true

# Wait for the home onboarding to appear before tapping.
# Android emulators are slower to initialise (DB setup + splash delay +
# Metro bundle compilation after clearState) so we use a generous timeout.
- extendedWaitUntil:
    visible:
      id: "done-button"
    timeout: 90000

# Complete the onboarding flow (single step)
- tapOn:
    id: "done-button"
# Wait for the onboarding overlay to finish closing before the next tap
- extendedWaitUntil:
    notVisible:
      id: "done-button"
    timeout: 5000

# Wait for app to load (splash screen then home)
- extendedWaitUntil:
    visible: "No caddy needed!"
    timeout: 45000

# Screenshot 1: Home screen
- tapOn:
    text: ".*Home.*"
    index: 0
- extendedWaitUntil:
    visible: "Be your own best caddy"
    timeout: 5000
- takeScreenshot: .maestro/screenshots/01-home

# Screenshot 2: Play screen (tap Play link)
- tapOn:
    id: "tab-play"
    index: 0

# Complete the onboarding flow - step 1
- tapOn:
    text: ".*Next.*"
    index: 0

# Complete the onboarding flow - step 2
- tapOn:
    text: ".*Done.*"
    index: 0
# Wait for the onboarding overlay to finish closing before the next tap
- extendedWaitUntil:
    notVisible:
      id: "done-button"
    timeout: 5000

# Wait for Play screen to render, then tap the Start Round button
- extendedWaitUntil:
    visible: "Play"
    timeout: 30000
- takeScreenshot: .maestro/screenshots/02-play

# Enter the course name before starting the round
- extendedWaitUntil:
    visible:
      id: "course-name-input"
    timeout: 5000
- tapOn:
    id: "course-name-input"
- inputText: "Screenshot Test Course"
- hideKeyboard

# Screenshot 3: Start round (use testID tap instead of text)
- tapOn:
    id: "start-button"
- extendedWaitUntil:
    visible: "You"
    timeout: 10000
- takeScreenshot: .maestro/screenshots/02A-play-start-round

# Complete one hole with stats so the round has data for Stats.
# The putting card and the deadly sins sit on the same scrolling page, so fill them in before one scroll to Next.

# Enter the first putt
- scrollUntilVisible:
    element:
      id: "first-putt-input"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "first-putt-input"
- tapOn:
    id: "first-putt-input-option-1"

# Select the deadly sin "Trouble off tee"
- scrollUntilVisible:
    element:
      id: "7deadly-sins-toggle-trouble-off-tee"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "7deadly-sins-toggle-trouble-off-tee"

# Select Driver for the club off the tee, if the club picker is on screen (no clubs are saved yet on a fresh install)
- runFlow:
    when:
      visible:
        id: "club-picker-dropdown-toggle"
    commands:
      - tapOn:
          id: "club-picker-dropdown-toggle"
      - runFlow:
          when:
            visible:
              id: "club-picker-option-Driver"
          commands:
            - tapOn:
                id: "club-picker-option-Driver"
      - runFlow:
          when:
            notVisible:
              id: "club-picker-option-Driver"
          commands:
            - tapOn:
                id: "club-picker-dropdown-toggle"

# Save the hole with a single scroll to Next
- scrollUntilVisible:
    element:
      id: "next-hole-button"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "next-hole-button"

# End the round and save it (the tab bar is hidden during a round)
- extendedWaitUntil:
    visible:
      id: "end-round-button"
    timeout: 5000
- tapOn:
    id: "end-round-button"
- extendedWaitUntil:
    visible:
      id: "end-round-save-button"
    timeout: 5000
- tapOn:
    id: "end-round-save-button"
# The summary scrolls, so bring the Done button into view first
- scrollUntilVisible:
    element:
      id: "round-summary-done-button"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "round-summary-done-button"

# Screenshot 4: Distances (opened from My Bag)
- tapOn:
    id: "tab-my-bag"
- tapOn:
    id: "bag-row-distances"

# Complete the onboarding flow (single step)
- tapOn:
    text: ".*Done.*"
    index: 0
# Wait for the onboarding overlay to finish closing before the next tap
- extendedWaitUntil:
    notVisible:
      id: "done-button"
    timeout: 5000

- extendedWaitUntil:
    visible: "Distances"
    timeout: 5000
- takeScreenshot: .maestro/screenshots/02B-play-distances
- tapOn:
    id: "distances-back-button"
# Confirm the back tap really returned to My Bag before moving on
- extendedWaitUntil:
    visible:
      id: "bag-row-wedge-chart"
    timeout: 5000

# Screenshot 5: Wedge Chart (opened from My Bag)
- tapOn:
    id: "bag-row-wedge-chart"

# Complete the onboarding flow (single step)
- tapOn:
    text: ".*Done.*"
    index: 0
# Wait for the onboarding overlay to finish closing before the next tap
- extendedWaitUntil:
    notVisible:
      id: "done-button"
    timeout: 5000

- extendedWaitUntil:
    visible: "Carry distance, not total"
    timeout: 5000
- takeScreenshot: .maestro/screenshots/02C-play-wedge-chart
- tapOn:
    id: "wedge-back-button"
# Confirm the back tap really returned to My Bag before moving on
- extendedWaitUntil:
    visible:
      id: "bag-row-wedge-chart"
    timeout: 5000

# Return: Home screen
- tapOn:
    text: ".*Home.*"
    index: 0
- extendedWaitUntil:
    visible: "Be your own best caddy"
    timeout: 5000

# Screenshot 5: Practice
- tapOn:
    id: "tab-practice"

# Complete the onboarding flow (single step)
- tapOn:
    text: ".*Done.*"
    index: 0
# Wait for the onboarding overlay to finish closing before the next tap
- extendedWaitUntil:
    notVisible:
      id: "done-button"
    timeout: 5000

# Screenshot 5: Practice
- extendedWaitUntil:
    visible: "Making practice time effective"
    timeout: 5000
- takeScreenshot: .maestro/screenshots/03-practice-options

# Screenshot 6: Tools
- tapOn:
    id: "practice-sub-menu-tools"
- extendedWaitUntil:
    visible:
      id: "tool-link-tempo"
    timeout: 5000
- takeScreenshot: .maestro/screenshots/03B-practice-tools

# Screenshot 7: History
- tapOn: "History"
- extendedWaitUntil:
    visible: "No challenge history yet"
    timeout: 5000
- takeScreenshot: .maestro/screenshots/03C-practice-history

# Return: Home screen
- tapOn:
    text: ".*Home.*"
    index: 0
- extendedWaitUntil:
    visible: "Be your own best caddy"
    timeout: 5000

# Screenshot 8: Perform
- tapOn:
    id: "tab-perform"

# Dismiss the "Perform guide" onboarding overlay
- extendedWaitUntil:
    visible:
      id: "done-button"
    timeout: 15000

# Complete the onboarding flow (single step)
- tapOn:
    text: ".*Done.*"
    index: 0
# Wait for the onboarding overlay to finish closing before the next tap
- extendedWaitUntil:
    notVisible:
      id: "done-button"
    timeout: 5000

# Stats opens on Rounds: wait for it, then screenshot
- extendedWaitUntil:
    visible:
      id: "perform-sub-menu-rounds"
    timeout: 15000
- takeScreenshot: .maestro/screenshots/04-perform-rounds

# Switch to Sins (the Deadly Sins view) and wait for its heading
- tapOn:
    id: "perform-sub-menu-sins"
- extendedWaitUntil:
    visible: "Deadly sins"
    timeout: 10000
- takeScreenshot: .maestro/screenshots/04-perform-options

# Screenshot 9: Pros menu
- tapOn: "Putting"
- extendedWaitUntil:
    visible: "1 ft"
    timeout: 5000
- takeScreenshot: .maestro/screenshots/04A-perform-putting

# Screenshot 10: Proximity menu
- tapOn: "Proximity"
- extendedWaitUntil:
    visible:
      id: "proximity-heading"
    timeout: 5000
- takeScreenshot: .maestro/screenshots/04A-perform-proximity

# Return: Home screen
- tapOn:
    text: ".*Home.*"
    index: 0
- extendedWaitUntil:
    visible: "Be your own best caddy"
    timeout: 5000

# Screenshot 11: Settings (reached via the header gear icon)
- tapOn:
    id: "home-settings-link"

# Dismiss the "Settings guide" onboarding overlay
- extendedWaitUntil:
    visible:
      id: "done-button"
    timeout: 15000

# Complete the onboarding flow (single step)
- tapOn:
    text: ".*Done.*"
    index: 0
# Wait for the onboarding overlay to finish closing before the next tap
- extendedWaitUntil:
    notVisible:
      id: "done-button"
    timeout: 5000

# Settings is a single page now (no tabs): wait for the System controls
- extendedWaitUntil:
    visible: "Notifications"
    timeout: 5000
- takeScreenshot: .maestro/screenshots/05-settings

# End of screenshot flow